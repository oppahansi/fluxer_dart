name: Feature request
description: Suggest something for fluxer_dart
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't currently possible or is awkward?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using now, or other approaches you considered
    validations:
      required: false

  - type: checkboxes
    id: platform-check
    attributes:
      label: Platform check
      description: >-
        This ecosystem verifies behavior against Fluxer's real API/gateway
        rather than assuming Discord parity — if this request depends on
        Fluxer actually supporting something, it helps to confirm that first.
      options:
        - label: >-
            I've checked (or this doesn't depend on) what Fluxer's
            OpenAPI spec / gateway actually supports
          required: false
